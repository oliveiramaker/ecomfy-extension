<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ecomfy Radar</title><link rel="stylesheet" href="popup.css"></head><body><main><header><div class="brand"><img src="icon.svg"><div><b>Ecomfy Radar</b><small>Shopee → Ecomfy</small></div></div><span id="state" class="badge">Capturando</span></header><section id="error" class="error hidden"></section><section id="preview" class="shot hidden"><img id="screenshot" alt="Captura da aba"><small>Print da área visível da Shopee</small></section><section class="form"><label>Produto<input id="title" type="text"></label><div class="grid"><label>Preço atual (R$)<input id="price" type="number" step="0.01"></label><label>Seu custo (R$)<input id="cost" type="number" step="0.01" placeholder="Ex: 4,00"></label></div><div class="grid"><label>Vendidos<input id="sold" type="number" step="1"></label><label>Nota<input id="rating" type="number" min="0" max="5" step="0.1"></label></div><div class="grid"><label>Avaliações<input id="reviews" type="number" step="1"></label><label>Imagens<input id="images" type="number" step="1"></label></div><label class="check"><input id="video" type="checkbox"> O anúncio tem vídeo</label><p id="source" class="hint"></p><button id="send" disabled>Abrir análise no Ecomfy</button><button id="recapture" class="secondary">Capturar novamente</button></section></main><script src="popup.js"></script></body></html>
